<!DOCTYPE html>
<html lang="ky">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SAMARA ACADEMY — أكاديمية سامارا</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500;600&family=Amiri:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #0a1428;
            --em: #0b4a3c;
            --cream: #f6efdf;
            --champ: #e8d5a8;
            --gold: #c9a24b;
            --white: #fff
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: Inter, sans-serif;
            color: var(--cream);
            background: var(--navy);
            overflow-x: hidden;
            line-height: 1.6
        }

        body:before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: .07;
            background: repeating-conic-gradient(from 0deg at 50% 50%, var(--gold) 0 5deg, transparent 5deg 45deg) 0 0/70px 70px, radial-gradient(circle at 20% 10%, var(--em), transparent 60%)
        }

        h1,
        h2,
        h3 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700
        }

        .ar {
            font-family: Amiri, serif;
            direction: rtl
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(10, 20, 40, .82);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--gold)
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 20px;
            max-width: 1300px;
            margin: auto
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            color: var(--champ);
            line-height: 1.1;
            cursor: pointer
        }

        .logo small {
            display: block;
            font-family: Amiri;
            font-size: 15px;
            color: var(--gold)
        }

        nav {
            display: flex;
            gap: 2px;
            flex: 1;
            flex-wrap: wrap
        }

        nav a {
            padding: 6px 9px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            color: var(--cream)
        }

        nav a:hover,
        nav a.on {
            background: var(--gold);
            color: var(--navy)
        }

        select,
        input,
        textarea,
        button {
            font: inherit
        }

        select {
            background: var(--navy);
            color: var(--cream);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 5px
        }

        #burger {
            display: none;
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 8px;
            font-size: 20px;
            padding: 2px 10px
        }

        .srch {
            padding: 0 20px 10px;
            max-width: 1300px;
            margin: auto
        }

        .srch input {
            width: 100%;
            padding: 9px 16px;
            border-radius: 25px;
            border: 1px solid var(--gold);
            background: rgba(255, 255, 255, .07);
            color: var(--cream)
        }

        #res {
            position: absolute;
            left: 20px;
            right: 20px;
            max-width: 700px;
            background: var(--navy);
            border: 1px solid var(--gold);
            border-radius: 12px;
            display: none;
            max-height: 300px;
            overflow: auto
        }

        #res div {
            padding: 8px 14px;
            cursor: pointer;
            border-bottom: 1px solid #ffffff18
        }

        #res div:hover {
            background: var(--em)
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 24px 18px 60px
        }

        .view {
            display: none
        }

        .view.on {
            display: block;
            animation: in .5s
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(14px)
            }
        }

        .hero {
            min-height: 78vh;
            display: grid;
            place-items: center;
            text-align: center;
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            padding: 40px 20px;
            background: radial-gradient(circle at 30% 20%, #0f6b57aa, transparent 55%), radial-gradient(circle at 80% 80%, #c9a24b33, transparent 50%), linear-gradient(160deg, #0a1428, #08261f);
            border: 1px solid #c9a24b66
        }

        .hero h1 {
            font-size: clamp(32px, 6vw, 64px);
            color: var(--champ);
            max-width: 850px;
            line-height: 1.1
        }

        .hero .ar {
            font-size: clamp(28px, 5vw, 48px);
            color: var(--gold);
            margin: 18px 0;
            text-shadow: 0 0 30px #c9a24b88
        }

        .fl {
            position: absolute;
            font-family: Amiri;
            color: var(--gold);
            opacity: .18;
            font-size: 60px;
            animation: fl 9s ease-in-out infinite
        }

        @keyframes fl {
            50% {
                transform: translateY(-30px) rotate(8deg)
            }
        }

        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 8px var(--gold);
            animation: fl 6s infinite
        }

        .btn {
            display: inline-block;
            padding: 12px 26px;
            border-radius: 30px;
            border: 1px solid var(--gold);
            background: none;
            color: var(--champ);
            cursor: pointer;
            margin: 6px;
            transition: .3s
        }

        .btn.gold,
        .btn:hover {
            background: linear-gradient(135deg, #e8d5a8, #c9a24b);
            color: var(--navy);
            box-shadow: 0 0 20px #c9a24b66
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
            margin: 18px 0
        }

        .card {
            background: rgba(255, 255, 255, .06);
            backdrop-filter: blur(8px);
            border: 1px solid #c9a24b66;
            border-radius: 18px;
            padding: 18px;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 8px 30px #0006
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--gold)
        }

        .card .ar {
            font-size: 30px;
            color: var(--gold)
        }

        .card.done {
            background: #0b4a3c99
        }

        h2 {
            font-size: 34px;
            color: var(--champ);
            margin: 26px 0 6px
        }

        .sub {
            opacity: .8;
            margin-bottom: 10px
        }

        #modal {
            position: fixed;
            inset: 0;
            background: #000b;
            z-index: 100;
            display: none;
            place-items: center;
            padding: 14px
        }

        #modal.on {
            display: grid
        }

        .box {
            background: linear-gradient(160deg, #0d1e3a, #0a2f27);
            border: 1px solid var(--gold);
            border-radius: 22px;
            max-width: 720px;
            width: 100%;
            max-height: 92vh;
            overflow: auto;
            padding: 26px
        }

        .box .ex {
            background: #ffffff10;
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0
        }

        .box .ex .ar {
            font-size: 28px;
            color: var(--champ)
        }

        .x {
            float: right;
            background: none;
            border: 0;
            color: var(--gold);
            font-size: 26px;
            cursor: pointer
        }

        input.t,
        textarea {
            width: 100%;
            padding: 11px;
            border-radius: 12px;
            border: 1px solid var(--gold);
            background: #ffffff12;
            color: var(--cream);
            margin: 8px 0
        }

        .ok {
            color: #7be0a8
        }

        .no {
            color: #ff9d9d
        }

        .bar2 {
            height: 12px;
            background: #ffffff18;
            border-radius: 8px;
            overflow: hidden
        }

        .bar2 i {
            display: block;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--em), var(--gold));
            transition: width 1.2s
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            margin: 6px 0
        }

        .img {
            height: 150px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--em), var(--navy)) center/cover;
            border: 1px solid var(--gold);
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            padding: 6px
        }

        .img button {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            border: 0;
            background: #000a;
            color: var(--champ);
            cursor: pointer
        }

        footer {
            border-top: 1px solid var(--gold);
            text-align: center;
            padding: 30px 16px;
            background: #06101f
        }

        footer a {
            margin: 0 8px;
            color: var(--champ);
            cursor: pointer;
            font-size: 14px
        }

        .daily {
            text-align: center;
            padding: 30px
        }

        .daily .ar {
            font-size: 64px;
            color: var(--gold)
        }

        @media(max-width:1020px) {
            #burger {
                display: block;
                margin-left: auto
            }

            nav {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--navy);
                padding: 12px;
                flex-direction: column
            }

            nav.open {
                display: flex
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="bar">
            <div class="logo" onclick="go('home')">SAMARA ACADEMY<small class="ar">أكاديمية سامارا</small></div>

            el("mbox").innerHTML = `<button class="x" onclick="closeM()">×</button><h2>${l[0]}</h2><p>${l[1]}</p><p style="opacity:.8">🇷🇺 ${l[2]}</p>
 <div class="ex"><div class="ar">${l[3]}</div><small>${l[4]}</small> <button class="btn" onclick="speak('${l[3].split(/[ ،←—]/)[0]}')">${t("listen")}</button></div>
 <h3>${t("check")}</h3><p>${l[5]}</p><input class="t" id="ans" placeholder="${t("yours")}"><button class="btn gold" onclick="chk('${k}',${i})">${t("checkbtn")}</button><div id="fb"></div>
 <div style="display:flex;justify-content:space-between;margin-top:14px"><button class="btn" onclick="${i > 0 ? `openL('${k}',${i - 1})` : "closeM()"}">${t("prev")}</button><button class="btn" onclick="${i < c.lessons.length - 1 ? `openL('${k}',${i + 1})` : "closeM()"}">${t("next")}</button></div>`;
            el("modal").classList.add("on")
        }
        function chk(k, i) {
            const l = COURSES[k].lessons[i], ok = isRight(el("ans").value, l[6]);
            el("fb").innerHTML = ok ? `<p class="ok">${t("ok")}</p><p>${t("done")}</p>` : `<p class="no">${t("bad")}</p><p>${t("answer")}: ${l[6][0]}</p>`;
            if (ok) { prog[k + i] = 1; save() }
        }
        const closeM = () => { el("modal").classList.remove("on"); go(cur) };

        // ===== VOCAB =====
        function lugat() {
            const cats = [...new Set(VOCAB.map(v => v[6]))];
            return `<h2><span class="ar">اللغة</span> ${t("lugat")}</h2>` + cats.map(c => `<h3 style="margin-top:18px">${c}</h3><div class="grid">${VOCAB.filter(v => v[6] == c).map(v => `<div class="card"><div class="ar">${v[0]}</div><b>${v[1]}</b><p>${v[2]} · ${v[3]}</p><p class="ar" style="font-size:20px">${v[4]}</p><small>${v[5]}</small><br><button class="btn" onclick="speak('${v[0]}')">${t("listen")}</button></div>`).join("")}</div>`).join("")
        }
        // ===== QURAN =====
        function quran() { return `<h2>${t("quran")}</h2>` + QURAN.map(q => `<div class="card" style="cursor:default;margin:14px 0"><div class="ar" style="font-size:34px;text-align:center">${q.ar}</div><p style="text-align:center"><i>${q.tr}</i></p><p><b>Сөз-сөз:</b> ${q.words}</p><p><b>Сарф:</b> ${q.sarf}</p><p><b>Нахву:</b> ${q.nahw}</p><p><b>Лугат:</b> ${q.vocab}</p></div>`).join("") }
        // ===== PRACTICE =====
        function practice() { return `<h2>${t("practice")}</h2>` + PRACTICE.map((p, i) => `<div class="card" style="cursor:default;margin:12px 0"><h3>${p[0]}</h3><input class="t" id="p${i}" placeholder="${t("yours")}" onkeydown="if(event.key=='Enter')pc(${i})"><button class="btn gold" onclick="pc(${i})">${t("checkbtn")}</button><div id="pf${i}"></div></div>`).join("") }
        function pc(i) {
            const p = PRACTICE[i], ok = isRight(el("p" + i).value, p[1]);
            el("pf" + i).innerHTML = ok ? `<p class="ok">${t("ok")}</p><p>${p[2]}</p>` : `<p class="no">${t("bad")}</p><p>${t("answer")}: ${p[1][0]} — ${p[2]}</p>`
        }
        // ===== QUIZ =====
        let qi = 0, qs = 0;
        function startQuiz() { qi = 0; qs = 0; showQ() }
        function showQ() {
            const b = el("qbox");
            if (qi >= QUIZ.length) {
                const p = Math.round(qs / QUIZ.length * 100); prog.test = Math.max(prog.test || 0, p); save();
                b.innerHTML = `<h2>${t("score")}: ${qs} / ${QUIZ.length}</h2><h3>${p}%</h3><button class="btn gold" onclick="startQuiz()">${t("again")}</button>`; return
            }
            const q = QUIZ[qi]; b.innerHTML = `<small>${qi + 1}/${QUIZ.length}</small><h3 style="font-size:28px">${q[0]}</h3>` + q[1].map((o, j) => `<button class="btn opt" onclick="ans(${j})">${"ABCD"[j]}) ${o}</button>`).join("") + `<div id="qf"></div>`
        }
        function ans(j) {
            const q = QUIZ[qi], ok = j == q[2]; if (ok) qs++;
            el("qf").innerHTML = ok ? `<p class="ok">МашаАллах! Туура жооп 🌸</p>` : `<p class="no">Кайра аракет кылып көр 🌱 — ${t("answer")}: ${q[1][q[2]]}</p>`;
            document.querySelectorAll(".opt").forEach(b => b.disabled = true); setTimeout(() => { qi++; showQ() }, 1300)
        }
        function test() { return `<h2>${t("test")}</h2><div class="card" style="cursor:default" id="qbox"></div>` }
        // ===== HELP =====
        function help() {
            return `<h2>${t("help")}</h2><div class="card" style="cursor:default"><h3>${t("ask")}</h3><textarea id="hq" rows="2" placeholder="Фаил деген эмне?"></textarea><button class="btn gold" onclick="hAsk()">${t("send")}</button><div id="ha"></div></div>
 <div class="grid">${FAQ.map(f => `<div class="card" onclick="this.querySelector('p').style.display='block'"><h3>${f[0]}</h3><p style="display:none">${f[1]}</p></div>`).join("")}</div>`
        }
        function hAsk() {
            const n = norm(el("hq").value); let best = null, sc = 0;
            FAQ.forEach(f => { const w = n.split(" ").filter(x => x.length > 2); const s = w.filter(x => norm(f[0] + " " + f[1]).includes(x)).length; if (s > sc) { sc = s; best = f } });
            el("ha").innerHTML = best ? `<p><b>${best[0]}</b><br>${best[1]}</p>` : `<p>${t("none")}</p>`
        }
        // ===== PROGRESS =====
        function progress() {
            const pc = k => Math.round(COURSES[k].lessons.filter((_, i) => prog[k + i]).length / COURSES[k].lessons.length * 100);
            const rows = [["sarf", pc("sarf")], ["nahw", pc("nahw")], ["tajweed", pc("tajweed")], ["test", prog.test || 0]];
            return `<h2>${t("progress")}</h2>` + rows.map(r => `<div class="card" style="cursor:default;margin:10px 0"><b>${t(r[0])}: ${r[1]}%</b><div class="bar2"><i data-w="${r[1]}"></i></div></div>`).join("")
        }
        // ===== SEARCH =====
        function search(v) {
            const n = norm(v), r = el("res"); if (n.length < 2) { r.style.display = "none"; return }
            const hits = [];
            for (const k in COURSES) COURSES[k].lessons.forEach((l, i) => { if (norm(l.slice(0, 5).join(" ")).includes(n)) hits.push([`${t(k)}: ${l[0]}`, () => openL(k, i)]) });
            VOCAB.forEach(w => { if (norm(w.join(" ")).includes(n)) hits.push([`${w[0]} — ${w[2]}`, () => go("lugat")]) });
            QURAN.forEach(q => { if (norm(q.ar + q.tr + q.words).includes(n)) hits.push([q.ar, () => go("quran")]) });
            window._h = hits; r.innerHTML = hits.length ? hits.slice(0, 12).map((h, i) => `<div onclick="_h[${i}][1]()">${h[0]}</div>`).join("") : `<div>${t("none")}</div>`; r.style.display = "block"
        }
        el("lang").value = L; buildNav(); go("home");
    </script>
</body>

</html>
